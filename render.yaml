services:
  - type: web
    name: cybercore-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CYBERCORE_SLM_ENABLED
        value: "false"

  - type: web
    name: cybercore-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: sh build-render-config.sh
    staticPublishPath: .
    envVars:
      - key: CYBERCORE_API_HOST
        fromService:
          type: web
          name: cybercore-api
          property: host
